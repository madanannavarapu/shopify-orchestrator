events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name niadat.com www.niadat.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name niadat.com www.niadat.com;

        ssl_certificate     /etc/nginx/certs/niadat.pem;
        ssl_certificate_key /etc/nginx/certs/niadat.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        location = / {
            root /usr/share/nginx/html;
            try_files /compliance-suite-landing.html =404;
        }

        location = /service-map {
            root /usr/share/nginx/html;
            try_files /service-map.html =404;
        }

        location = /scan.html {
            set $be compliance-backend:8000;
            proxy_pass http://$be/scan.html;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/email/inbound {
            set $be compliance-backend:8000;
            proxy_pass http://$be/api/email/inbound;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 50M;
        }

        location /api/internal/ {
            return 403;
        }

        location /api/ {
            set $be compliance-backend:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$be;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 100M;
        }

        location /webhooks/ {
            set $be compliance-backend:8000;
            rewrite ^/webhooks/(.*)$ /webhooks/$1 break;
            proxy_pass http://$be;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            set $be compliance-backend:8000;
            rewrite ^/health(.*)$ /health$1 break;
            proxy_pass http://$be;
            proxy_set_header Host $host;
        }

        location = /googlea918ba2e4467fe7a.html {
            root /usr/share/nginx/html;
            try_files /googlea918ba2e4467fe7a.html =404;
        }

        location = /screencast.webm {
            root /usr/share/nginx/html;
            try_files /screencast.webm =404;
        }

        location /orchestrator/webhooks/ {
            set $be compliance-backend:8000;
            rewrite ^/orchestrator/(.*) /$1 break;
            proxy_pass http://$be;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /orchestrator/ {
            set $orch shopify-orchestrator:3000;
            rewrite ^/orchestrator/(.*) /$1 break;
            proxy_pass http://$orch;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /auth {
            set $orch shopify-orchestrator:3000;
            proxy_pass http://$orch;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $fe compliance-frontend:3000;
            proxy_pass http://$fe;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
